parameters:
  - name: serviceName
    type: string
  - name: dotnetVersion
    type: string
    default: 8.x

jobs:
  - job: Build
    steps:
      - task: UseDotNet@2
        inputs:
          version: ${{ parameters.dotnetVersion }}
      - script: dotnet restore --locked-mode
        displayName: Restore
      - script: dotnet build -c Release --no-restore
        displayName: Build
      - script: dotnet test -c Release --no-build --collect:"XPlat Code Coverage" --logger trx
        displayName: Unit tests
      - task: PublishTestResults@2
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: "**/*.trx"
      - task: PublishCodeCoverageResults@2
        inputs:
          summaryFileLocation: "**/coverage.cobertura.xml"
      - task: Docker@2
        displayName: Build and push image
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: sc-acr
          repository: ${{ parameters.serviceName }}
          command: buildAndPush
          tags: |
            $(Build.BuildNumber)
            $(Build.SourceVersion)
      - task: UniversalPackages@0
        displayName: Publish versioned Helm package to Azure Artifacts
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        inputs:
          command: publish
          publishDirectory: deploy/helm
          vstsFeedPublish: platform/releases
          vstsFeedPackagePublish: ${{ parameters.serviceName }}-chart
          versionOption: patch
